<div id="deforum-media-review" aria-label="Linked video review">
  <style>
    #deforum-media-review .review-stack { display: grid; gap: 20px; margin-top: 16px; }
    #deforum-media-review .review-heading { display: flex; align-items: end; gap: 12px; margin-bottom: 8px; }
    #deforum-media-review .review-choice { flex: 1; min-width: 0; }
    #deforum-media-review video { display: block; width: 100%; max-height: 300px; object-fit: contain; background: var(--background); }
    #deforum-media-review .review-meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; margin-top: 6px; }
    #deforum-media-review .review-timeline { display: block; margin-top: 12px; }
    #deforum-media-review .review-footer { margin-top: 14px; }
    #deforum-media-review .review-caption { display: flex; gap: 6px; align-items: center; }
    #deforum-media-review .review-details { position: fixed; inset: auto; margin: 0; width: min(380px, calc(100vw - 24px)); max-height: min(320px, calc(100vh - 24px)); overflow: auto; padding: 14px; border: 1px solid var(--border, #777); border-radius: 8px; background: var(--background); color: var(--foreground); white-space: pre-line; font: inherit; }
    #deforum-media-review [hidden] { display: none !important; }
  </style>
  <div class="viz-controls" aria-label="Shared playback controls">
    <button class="btn btn-primary" type="button" data-action="play" disabled>Play all</button>
    <button class="btn" type="button" data-action="previous" aria-label="Previous frame" data-tooltip="Previous frame · Left arrow">← Frame</button>
    <button class="btn" type="button" data-action="next" aria-label="Next frame" data-tooltip="Next frame · Right arrow">Frame →</button>
    <button class="btn" type="button" data-action="previous-painting" data-tooltip="Previous painting · Shift + Left arrow">← Painting</button>
    <button class="btn" type="button" data-action="next-painting" data-tooltip="Next painting · Shift + Right arrow">Painting →</button>
    <label class="form-label">Speed
      <select class="form-select" data-speed aria-label="Playback speed">
        <option value="0.25">¼×</option><option value="0.5">½×</option><option value="1" selected>1×</option><option value="2">2×</option>
      </select>
    </label>
  </div>
  <label class="form-label review-timeline">Shared timeline · <output class="tabular-nums" data-position>Loading</output>
    <input class="form-range" data-timeline type="range" min="0" max="0" value="0" step="1" aria-label="Shared video frame">
  </label>
  <div class="text-small" data-status role="status" aria-live="polite">Loading videos…</div>
  <div class="text-destructive" data-error role="alert" hidden></div>
  <div class="review-stack" data-stack></div>
  <div class="viz-row review-footer">
    <button class="btn" type="button" data-action="add">Add video</button>
    <span class="text-small" data-quality></span>
  </div>
  <script type="application/json" id="deforum-review-data">__REVIEW_DATA__</script>
  <script>
__REVIEW_TIMELINE__
__REVIEW_CONTROLLER__
  </script>
</div>
