<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__</title>
<style>
:root { color-scheme:light dark; --background:light-dark(#fafafa,#171717); --foreground:light-dark(#222,#eee); font:14px/1.4 system-ui,sans-serif; color:var(--foreground); background:var(--background); }
* { box-sizing:border-box; }
body { margin:0; padding:12px; }
.viz-controls,.viz-row { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
.form-label { display:block; }
.btn,.form-select { font:inherit; padding:6px 9px; border:1px solid light-dark(#aaa,#666); border-radius:6px; color:inherit; background:var(--background); }
.btn { cursor:pointer; white-space:nowrap; }
.btn.review-info { border:0; background:transparent; }
.btn:disabled { opacity:.45; cursor:default; }
.form-select,.form-range { width:100%; }
.text-small { font-size:12px; }
.tabular-nums { font-variant-numeric:tabular-nums; }
.text-destructive { color:light-dark(#b40000,#ffa3a3); }
body #deforum-media-review { height:calc(100dvh - 24px); display:flex; flex-direction:column; gap:8px; }
body #deforum-media-review:fullscreen { height:100dvh; padding:12px; background:var(--background); }
body #deforum-media-review .viz-controls > .form-label { display:flex; align-items:center; gap:6px; }
body #deforum-media-review .review-timeline { margin:0; }
body #deforum-media-review .review-stack { flex:1; min-height:0; display:grid; grid-auto-flow:column; grid-auto-columns:minmax(0,1fr); gap:12px; margin:0; }
body #deforum-media-review .review-stack > section { display:grid; grid-template-rows:auto auto minmax(0,1fr) auto; gap:6px; min-width:0; min-height:0; }
body #deforum-media-review .review-heading { gap:6px; margin:0; align-items:end; }
body #deforum-media-review .review-choice { min-width:0; }
body #deforum-media-review video { width:100%; height:100%; min-height:0; max-height:none; object-fit:contain; background:light-dark(#eee,#101010); }
body #deforum-media-review .review-meta { margin:0; justify-content:flex-start; }
body #deforum-media-review .review-footer { margin:0; }
@media(max-width:600px) {
  body { padding:8px; }
  body #deforum-media-review { height:calc(100dvh - 16px); gap:6px; }
  body #deforum-media-review .review-stack { grid-auto-flow:row; grid-auto-columns:auto; grid-auto-rows:minmax(0,1fr); }
  body #deforum-media-review .review-choice { display:flex; align-items:center; gap:6px; }
  body #deforum-media-review .review-meta { gap:2px 8px; }
}
@media(pointer:coarse) { .btn,.form-select { min-height:44px; } }
</style></head><body>
__FRAGMENT__
<script>
(function () {
  const root=document.getElementById('deforum-media-review');
  if (!document.fullscreenEnabled) return;
  const button=document.createElement('button');
  button.type='button'; button.className='btn'; button.textContent='Full screen';
  button.addEventListener('click', async () => {
    try { if (document.fullscreenElement) await document.exitFullscreen(); else await root.requestFullscreen(); }
    catch (error) { root.querySelector('[data-status]').textContent='Full screen is unavailable in this browser window.'; }
  });
  document.addEventListener('fullscreenchange',()=> { button.textContent=document.fullscreenElement?'Exit full screen':'Full screen'; });
  root.querySelector('.viz-controls').append(button);
})();
</script>
</body></html>
