[project]
name = "deforum-experiment"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.89",
    "numpy==2.5.3",
    "opencv-python==5.0.0.93",
    "pillow==12.3.0",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deforum_lab"]

[tool.hatch.build.targets.sdist]
only-include = ["src/deforum_lab", "pyproject.toml", "uv.lock", "README.md"]

[dependency-groups]
dev = [
    "ruff==0.16.2",
]
