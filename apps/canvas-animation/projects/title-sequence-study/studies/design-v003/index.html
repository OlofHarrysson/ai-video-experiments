<!doctype html><html lang="en"><meta charset="utf-8"><title>Graphic design study</title><style>body{margin:20px;background:#161616;color:#eee;font:16px system-ui}main{max-width:1280px;margin:auto}canvas{width:100%;display:block;margin:16px 0 8px}h1{font-size:24px}p{color:#bbb}button{font:inherit;padding:8px 15px;background:#333;color:#fff;border:1px solid #555}</style><main><h1>Graphic design study</h1><p>Three compound identities. Stills first; short stepped-motion tests below each.</p><div id="studies"></div></main><script src="art.js"></script><script>
let active=null,raf,start;DesignStudy.names.forEach((name,id)=>{const wrap=document.createElement('section'),c=document.createElement('canvas'),p=document.createElement('p'),b=document.createElement('button');c.width=1280;c.height=544;p.textContent=(id+1)+' · '+name;b.textContent='Play motion';b.onclick=()=>{if(active){cancelAnimationFrame(raf);active.b.textContent='Play motion';DesignStudy.render(active.id,0,active.c,true)}if(active?.id===id){active=null;return}active={id,c,b};start=performance.now();b.textContent='Stop';raf=requestAnimationFrame(tick)};wrap.append(c,p,b);document.querySelector('#studies').append(wrap);DesignStudy.render(id,0,c,true)});function tick(now){if(!active)return;DesignStudy.render(active.id,(now-start)/1000%3,active.c);raf=requestAnimationFrame(tick)}window.designReady=true;
</script></html>
