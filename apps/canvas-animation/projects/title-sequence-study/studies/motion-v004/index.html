<!doctype html><html lang="en"><meta charset="utf-8"><title>Night Fever render cycle</title><style>body{background:#151515;color:#eee;font:16px system-ui;margin:24px}main{max-width:1280px;margin:auto}canvas{width:100%;display:block}button,select{font:inherit;padding:8px;margin:12px 8px 0 0}p{color:#bbb}</style><main><h1>Night Fever render cycle</h1><p>Fixed composition. Six material treatments. Silent.</p><canvas id="view" width="1280" height="588"></canvas><select id="speed" aria-label="Cadence"><option value="6">Slower</option><option value="4">Medium</option><option value="2">Faster</option></select><button id="play">Play</button></main><script src="../design-v003/art.js"></script><script src="cycle.js"></script><script>
const c=document.getElementById('view'),b=document.getElementById('play'),s=document.getElementById('speed');let active=false,start=0,raf;function paint(t){RenderCycle.render(t,c,{hold:Number(s.value),label:true})}b.onclick=()=>{active=!active;b.textContent=active?'Pause':'Play';if(active){start=performance.now();raf=requestAnimationFrame(tick)}else cancelAnimationFrame(raf)};function tick(now){if(!active)return;paint((now-start)/1000);raf=requestAnimationFrame(tick)}s.onchange=()=>{start=performance.now();paint(0)};paint(0);window.cycleReady=true;
</script></html>
