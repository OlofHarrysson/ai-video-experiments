<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motion study</title>
<style>body{margin:24px;background:#111;color:#eee;font:16px system-ui}main{max-width:1280px;margin:auto}h1{font-size:24px}p{color:#aaa}canvas{display:block;width:100%;background:#000}nav{display:flex;gap:12px;align-items:center;margin:18px 0;flex-wrap:wrap}button,select{font:inherit;padding:8px;background:#282828;color:white;border:1px solid #555}input{flex:1;min-width:200px}output{font-variant-numeric:tabular-nums}</style>
<main><h1>Motion study</h1><p>Eight motion behaviors and an escalating edit. Silent. Sample words; theme undecided.</p><canvas id="view" width="1280" height="544"></canvas><nav><select id="scene" aria-label="Motion study"></select><button id="play">Play</button><input id="seek" aria-label="Time" type="range" min="0" max="4" step="0.01" value="1"><output id="time"></output></nav></main>
<script src="../../node_modules/gsap/dist/gsap.min.js"></script><script src="../../tools/font-data.js"></script><script src="../../tools/motion-kit.js"></script><script src="scenes.js"></script><script>
const c=document.getElementById('view'),select=document.getElementById('scene'),seek=document.getElementById('seek'),button=document.getElementById('play');let playing=false,last=0,raf;
MotionStudy.names.concat('Escalation').forEach((n,i)=>select.add(new Option((i+1)+' · '+n,i)));
function paint(){const t=Number(seek.value);Number(select.value)===8?MotionStudy.montage(t,c):MotionStudy.render(Number(select.value),t,c,{label:true});document.getElementById('time').textContent=t.toFixed(2)+' s'}
function stop(){playing=false;cancelAnimationFrame(raf);button.textContent='Play'}
select.onchange=()=>{stop();seek.max=Number(select.value)===8?MotionStudy.duration:3.7;seek.value=1;paint()};seek.oninput=()=>{stop();paint()};button.onclick=()=>{if(playing){stop();return}playing=true;button.textContent='Pause';last=performance.now();raf=requestAnimationFrame(tick)};
function tick(now){if(!playing)return;let t=Number(seek.value)+(now-last)/1000;last=now;if(t>Number(seek.max)){t=0}seek.value=t;paint();raf=requestAnimationFrame(tick)}paint();window.motionReady=true;
</script></html>
