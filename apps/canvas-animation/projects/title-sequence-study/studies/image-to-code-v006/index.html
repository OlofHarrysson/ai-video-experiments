<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wild Hours · editable lettering</title>
<style>body{margin:0;background:#101014;color:#eee;font:15px system-ui}header{padding:18px 24px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}h1{font-size:18px;margin:0;margin-right:auto}button,select{background:#27272e;color:white;border:1px solid #555;border-radius:5px;padding:7px 12px}label{display:flex;align-items:center;gap:7px}main{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 24px 24px}figure{margin:0;min-width:0}canvas,img{width:100%;display:block;background:#000}figcaption{padding:10px 0;color:#b7b4bf}footer{padding:0 24px 24px;color:#a6a1ad}input{max-width:110px}@media(max-width:900px){main{grid-template-columns:1fr}}</style>
<header><h1>Wild Hours</h1><button id="play">Play light</button><label>Light <input id="phase" type="range" min="0" max="143" value="0"></label><label>Depth <input id="depth" type="range" min="0" max="50" value="34"></label><label>View <select id="mode"><option value="enamel">Enamel</option><option value="flat">Silhouettes</option><option value="blue">Blue / silver</option></select></label><button id="save">Save PNG</button></header>
<main><figure><canvas id="art" width="1536" height="1024"></canvas><figcaption>Code reconstruction · editable paths and procedural materials</figcaption></figure><figure><img src="output/wild-hours-reference-01.png" alt="Generated Wild Hours design reference"><figcaption>Generated reference · design target</figcaption></figure></main><footer>Original placeholder lettering study. The reference image is used only for comparison; it is not sampled by the renderer.</footer>
<script src="geometry.js"></script><script src="details.js"></script><script src="renderer.js"></script><script>
const art=document.querySelector('#art'),phase=document.querySelector('#phase'),depth=document.querySelector('#depth'),mode=document.querySelector('#mode');let playing=false,origin=0;
function render(){WildRenderer.draw(art,Number(phase.value),{depth:Number(depth.value),flat:mode.value==='flat',palette:mode.value==='blue'?1:0})}
phase.oninput=depth.oninput=mode.onchange=render;document.querySelector('#play').onclick=()=>{playing=!playing;origin=performance.now()-Number(phase.value)/24*1000;document.querySelector('#play').textContent=playing?'Pause':'Play light';if(playing)requestAnimationFrame(tick)};
function tick(now){if(!playing)return;phase.value=Math.floor((now-origin)/1000*24)%144;render();requestAnimationFrame(tick)}
document.querySelector('#save').onclick=()=>{const a=document.createElement('a');a.download='wild-hours-code.png';a.href=art.toDataURL();a.click()};render();window.ready=true;
</script></html>
