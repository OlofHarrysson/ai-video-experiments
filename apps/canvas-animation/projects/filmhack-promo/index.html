<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Filmhack Reel</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        background: #111;
        color: #ddd;
        font: 13px/1.4 system-ui, sans-serif;
      }
      .stage {
        position: relative;
        height: calc(100vh - 110px);
        aspect-ratio: 9 / 16;
        margin-top: 12px;
      }
      .stage canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #overlay {
        pointer-events: none;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 10px;
        align-items: center;
        justify-content: center;
        max-width: 960px;
        padding: 10px;
      }
      #scrub {
        width: 360px;
      }
      #time {
        min-width: 240px;
        font-variant-numeric: tabular-nums;
      }
      #status {
        color: #888;
      }
      button {
        padding: 4px 10px;
        border: 1px solid #444;
        border-radius: 6px;
        background: #222;
        color: #eee;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <canvas id="film"></canvas>
      <canvas id="overlay"></canvas>
    </div>
    <div class="controls">
      <button id="play" disabled>Play</button>
      <input id="scrub" type="range" min="0" max="899" value="0" />
      <span id="time"></span>
      <span id="chapters"></span>
      <label><input id="safe" type="checkbox" /> Safe zones</label>
      <span id="status"></span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
