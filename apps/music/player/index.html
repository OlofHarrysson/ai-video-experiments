<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Undercurrent — sound player</title><link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
</head>
<body><main>
  <header><h1>Undercurrent</h1></header>
  <section class="transport" aria-label="Playback">
    <button id="play" class="primary" disabled>Loading…</button>
    <button id="restart" aria-label="Restart">↶</button>
    <output id="time">0:00 / 0:30</output>
    <label class="loop"><input id="loop" type="checkbox" checked> Loop</label>
    <label class="volume">Volume <input id="volume" aria-label="Volume" type="range" min="0" max="1" step=".01" value=".8"></label>
  </section>
  <input id="seek" type="range" min="0" max="30" step=".01" value="0" aria-label="Playback position">
  <div class="mix-heading"><h2>Sounds</h2><button id="reset">Reset mix</button></div>
  <section id="tracks" aria-label="Sounds"></section>
  <p id="status" role="status"></p>
</main><script type="module" src="/app.js"></script></body>
</html>
